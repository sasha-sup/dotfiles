# thinkfan needs /proc/acpi/ibm/fan, which only exists once thinkpad_acpi is
# loaded. Nothing was loading it deterministically: udev autoloads it from ACPI
# enumeration at about 4.3 s, while thinkfan.service starts after basic.target
# at about 1.9 s, so on a cold boot the daemon died with
# "ERROR: /proc/acpi/ibm/thermal: No such file or directory" and the fan stayed
# on the EC curve for the rest of the session.
#
# Listing the module here makes systemd-modules-load.service load it during
# early sysinit, which gives thinkfan.service's existing
# After=systemd-modules-load.service something real to order against. The
# fan_control=1 option from modprobe.d still applies; modules-load.d goes
# through libkmod and reads modprobe.d the same way modprobe does.
thinkpad_acpi
