# The packaged unit does not restart thinkfan. For a thermal daemon that is the
# wrong default: a single failure leaves the fan on the EC curve silently, until
# someone notices the noise and goes looking.
#
# Restarting is safe because failing is already safe. The thinkpad_acpi watchdog
# hands the fan back to the EC about 125 s after the daemon stops pinging it, so
# the window this covers is one where the machine is cooling itself correctly
# anyway - this just gets userspace control back without waiting for a reboot.
[Service]
Restart=on-failure
RestartSec=5s
