# thinkfan config for ThinkPad T14 Gen 4 (21HE), i7-1365U.
#
# Why this exists: the EC fan curve under the "balanced" platform profile holds
# a ~3460 RPM floor and does not walk it back down when the load that raised it
# goes away. It runs that flat, at 47 C or at 64 C, before during and after a
# load. This curve idles at ~2360 RPM instead and ramps from there.
#
# Safety: thinkfan arms the thinkpad_acpi watchdog. If the daemon dies or hangs,
# the EC takes the fan back to "auto" - measured at ~125 s after SIGKILL, which
# is thinkfan's hardcoded 120 s timeout plus a poll. The timeout is not
# configurable. Behind that sit the CPU's own protections, which do not depend
# on the fan at all: TM1 throttling and thermal shutdown at Tjmax 100 C.
#
# The last level is "level disengaged" (fan unrestricted), so a runaway
# temperature always ends in maximum airflow, never in a held level.
#
# Measured, all three on the same `stress --cpu 12` from a settled idle. The
# middle row is an earlier revision of this file that let the fan stop; it is
# kept here because it is the reason this one does not.
#
#                    idle    idle fan   turbo peak   sustained   load fan
#   EC auto        47-50 C   3460 RPM       82 C      62-63 C    3460 RPM
#   fan-off curve  58-62 C      0 RPM    94-98 C      69-73 C   ~2655 RPM
#   this curve     53-57 C   ~2360 RPM      90 C      66-69 C   ~2657 RPM
#
# The EC wins on every temperature because it never stops moving air. That is
# the whole trade: it buys those degrees with 3460 RPM around the clock, at 47 C
# idle as readily as under load. This curve gives up 8 C of burst headroom and
# 6 C of idle to run 1100 RPM slower when nothing is happening.
#
# The burst peak is mostly not a tuning problem. A fan needs seconds to move
# useful air and this CPU reaches 90 C in under ten, so by the time any curve
# reacts the peak has already happened. What actually moves that number is how
# cold the heatsink was when the burst started, which is why stopping the fan
# cost 8 C and why the floor above is not level 0.

sensors:
  # Package id 0 - the number Intel throttles on. Tjmax is 100 C.
  - hwmon: /sys/class/hwmon
    name: coretemp
    indices: [1]

  # NVMe Composite. Vendor warning threshold is 75.8 C, critical 86.8 C, so its
  # limits sit lower than the CPU's - the drive is the part that degrades first.
  - hwmon: /sys/class/hwmon
    name: nvme
    indices: [1]

  # EC watches five live sensors; the two above are only two of them. This is
  # the hottest of the rest - it sat at 49 C idle and 57 C under a full 12-core
  # load, so it tracks the CPU rather than leading it. Its limits are set well
  # above that band on purpose: it is a backstop for the one case the other two
  # sensors cannot see, something in the chassis heating while the CPU stays
  # cool. It should never be the sensor that drives the fan.
  #
  # tpacpi indices are 0-based, unlike the 1-based hwmon indices above. In
  # `cat /proc/acpi/ibm/thermal` this is the 7th number. Getting that wrong is
  # silent: a bad index reads -128, which sits below every limit, so the sensor
  # is simply dead and never votes. Check a config change against the daemon's
  # own output rather than assuming - stop the service and run
  # `thinkfan -c /etc/thinkfan.yaml -n`, then read the "Temperatures(bias):"
  # line it logs. Every sensor there has to show a plausible number.
  - tpacpi: /proc/acpi/ibm/thermal
    indices: [6]

fans:
  - tpacpi: /proc/acpi/ibm/fan

# Limits are [coretemp, nvme, tpacpi], in the sensor order above. Every level
# overlaps the one below it by 6-8 C; that gap is the hysteresis that keeps the
# fan from oscillating around a threshold.
#
# Idle is not one number. With the work VMs up the package wanders over 53-57 C
# and throws one-poll spikes of +9 to +11 C, briefly touching 66-70 C. Three
# earlier revisions set the bottom threshold against a snapshot of idle - 55 C,
# then 60 C, then 70 C - and the first two sat inside that band, so the fan
# cycled every few seconds. Thresholds have to clear the noise, not the average.
#
# The spikes themselves are handled by -b-5 in /etc/default/thinkfan, not by the
# thresholds. See that file: it is load-bearing, and this curve flaps without it.
levels:
  # Level 1 is the floor: the fan never stops. An earlier revision of this file
  # did stop it, and that turned out to cost about 10 C everywhere. With no air
  # moving, the heatsink stays saturated, idle settles ~10 C higher, and every
  # turbo burst then starts from that hotter baseline and peaked at 94-98 C
  # against a 100 C Tjmax. Level 1 is ~2350 RPM against the EC's flat 3460, so
  # this keeps most of the quiet and gives the thermal headroom back.
  - speed: 1
    upper_limit: [68, 64, 66]

  - speed: 2
    lower_limit: [60, 58, 58]
    upper_limit: [76, 70, 72]

  - speed: 3
    lower_limit: [68, 64, 64]
    upper_limit: [82, 74, 77]

  - speed: 4
    lower_limit: [74, 68, 70]
    upper_limit: [87, 77, 81]

  - speed: 5
    lower_limit: [79, 72, 74]
    upper_limit: [91, 80, 85]

  - speed: 7
    lower_limit: [84, 75, 78]
    upper_limit: [95, 84, 88]

  - speed: "level disengaged"
    lower_limit: [90, 79, 82]
