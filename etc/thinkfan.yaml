# thinkfan config for ThinkPad T14 Gen 4 (21HE), i7-1365U.
#
# Why this exists: the EC fan curve under the "balanced" platform profile holds
# a ~3500 RPM floor and does not walk it back down when the load that raised it
# goes away. That is audible at 45 C with the machine idle. This curve stops the
# fan entirely through the idle range and ramps from there.
#
# Safety: thinkfan arms the thinkpad_acpi watchdog. If the daemon dies or hangs,
# the EC takes the fan back to "auto" - measured at ~125 s after SIGKILL, which
# is thinkfan's hardcoded 120 s timeout plus a poll. The timeout is not
# configurable. Behind that sit the CPU's own protections, which do not depend
# on the fan at all: TM1 throttling and thermal shutdown at Tjmax 100 C.
#
# The last level is "level disengaged" (fan unrestricted), so a runaway
# temperature always ends in maximum airflow, never in a held level.
#
# Measured against the stock EC curve, same `stress --cpu 12` run both times:
#
#              turbo peak   sustained   idle fan    load fan
#   EC auto        88 C      62-68 C    3482 RPM    3482 RPM
#   this curve     90 C      64-68 C       0 RPM   ~2665 RPM
#
# The 2 C worse peak is the price of a stopped fan and is not tunable. thinkfan
# already jumps straight to "disengaged" on the first poll that sees the rise;
# the limit is mechanical, a fan at 0 RPM needs seconds to move useful air while
# the CPU reaches 90 C in under ten. Raising -b (rising-temperature bias) to 10
# was tried and changed the peak not at all, only making the post-burst tail
# louder, so the daemon runs at the default bias. 90 C is a few seconds of turbo
# against a 100 C Tjmax, and sustained load is where this curve is quieter.

sensors:
  # Package id 0 - the number Intel throttles on. Tjmax is 100 C.
  - hwmon: /sys/class/hwmon
    name: coretemp
    indices: [1]

  # NVMe Composite. Vendor warning threshold is 75.8 C, critical 86.8 C, so its
  # limits sit lower than the CPU's - the drive is the part that degrades first.
  - hwmon: /sys/class/hwmon
    name: nvme
    indices: [1]

  # EC watches five live sensors; the two above are only two of them. This is
  # the hottest of the rest - it sat at 49 C idle and 57 C under a full 12-core
  # load, so it tracks the CPU rather than leading it. Its limits are set well
  # above that band on purpose: it is a backstop for the one case the other two
  # sensors cannot see, something in the chassis heating while the CPU stays
  # cool. It should never be the sensor that drives the fan.
  #
  # tpacpi indices are 0-based, unlike the 1-based hwmon indices above. In
  # `cat /proc/acpi/ibm/thermal` this is the 7th number. Getting that wrong is
  # silent: a bad index reads -128, which sits below every limit, so the sensor
  # is simply dead and never votes. Check a config change against the daemon's
  # own output rather than assuming - stop the service and run
  # `thinkfan -c /etc/thinkfan.yaml -n`, then read the "Temperatures(bias):"
  # line it logs. Every sensor there has to show a plausible number.
  - tpacpi: /proc/acpi/ibm/thermal
    indices: [6]

fans:
  - tpacpi: /proc/acpi/ibm/fan

# Limits are [coretemp, nvme, tpacpi], in the sensor order above. Every level overlaps
# the one below it by 5-6 C; that gap is the hysteresis that keeps the fan from
# oscillating around a threshold.
#
# Level 0 runs to 60 C rather than something tighter because idle with both
# work VMs up sits at 50-53 C. A 55 C ceiling put that idle band right on the
# threshold and the fan toggled on and off every few seconds.
levels:
  - speed: 0
    upper_limit: [60, 62, 64]

  - speed: 1
    lower_limit: [54, 56, 58]
    upper_limit: [66, 67, 69]

  - speed: 2
    lower_limit: [60, 61, 63]
    upper_limit: [71, 70, 73]

  - speed: 3
    lower_limit: [65, 65, 67]
    upper_limit: [76, 73, 77]

  - speed: 4
    lower_limit: [70, 68, 71]
    upper_limit: [81, 76, 80]

  - speed: 5
    lower_limit: [75, 71, 74]
    upper_limit: [85, 78, 83]

  - speed: 7
    lower_limit: [80, 74, 77]
    upper_limit: [91, 81, 87]

  - speed: "level disengaged"
    lower_limit: [86, 77, 81]
