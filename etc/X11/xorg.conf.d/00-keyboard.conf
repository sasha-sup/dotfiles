# Xorg applies this at every keyboard device add, so it outranks any setxkbmap
# run from the session: reconnecting the Bluetooth TrackPoint Keyboard II is
# enough to reset the layout to whatever stands here.
#
# The group toggle is the Win+Space chord, not the bare left Win. grp:lwin_toggle
# rewrites that key to ISO_Next_Group with a LockGroup action and strips
# SetMods(Mod4) from it, and Fn+F7 on the TrackPoint Keyboard II is a firmware
# Super_L+P chord that i3 can only bind while the key still carries Mod4.
Section "InputClass"
    Identifier "system-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us,ru"
    Option "XkbOptions" "grp:win_space_toggle"
EndSection
