[colors]
; Cyberpunk 2077 HUD palette, taken from the game's main_colors.inkstyle
; (MainColors.* as shipped in HUD Painter's DEFAULT.json). The game's rule:
; red is text and lines, cyan is whatever is active or selected.
background = #0e0e17
background-alt = #121221
; MainColors.Neutral for values; over the wallpaper red-on-red did not read
foreground = #c0c8cf
; MainColors.Red, for labels next to a value
foreground-alt = #ff6159
; MainColors.MildRed, for separators
faint = #ae3b36
; primary fills backgrounds under white text, so it stays dark enough to read on
primary = #8e272a
; accent is for lines and glyphs only, never as a background under white text
accent = #ff6159
; MainColors.Blue on FaintBlue: the game's highlight for the selected item
select = #5ef6ff
select-bg = #172c2e
alert = #ff3e34
cyan = #5ef6ff
yellow = #ffd741

[bar/main]
monitor = ${env:MONITOR:}
width = 100%:-16
height = 22pt
offset-x = 8
offset-y = 8
radius = 0

; 70% opaque: fully clear lost the labels over the bright parts of the wallpaper
background = #b30e0e17
foreground = ${colors.foreground}

line-size = 2pt

padding-left = 0
padding-right = 2

module-margin = 1

separator = "/"
separator-foreground = ${colors.faint}

font-0 = "JetBrainsMono Nerd Font:size=11;2"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
; JetBrainsMono has no kanji; polybar falls through to this for the 荒坂 mark
font-2 = "Droid Sans Fallback:size=11;3"

modules-left = i3
modules-center = date
modules-right = network bluetooth volume cpu memory temperature fan battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; Only one polybar instance can own the systray. With a bar on every monitor,
; launch.sh sets TRAY_POSITION on the primary one and leaves the rest at "none",
; so the tray never races between bars.
tray-position = ${env:TRAY_POSITION:none}
tray-padding = 2

wm-restack = i3
override-redirect = true

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true

; The mark is a prefix, not its own module: the bar separator goes between every
; pair of modules, and a "/" right after the kanji read as noise.
format = <label-state> <label-mode>
format-prefix = "  荒坂  "
format-prefix-foreground = ${colors.accent}

label-focused = %index%
label-focused-background = ${colors.select-bg}
label-focused-foreground = ${colors.select}
label-focused-underline = ${colors.select}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.foreground-alt}

label-visible = %index%
label-visible-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.primary}
label-urgent-foreground = #ffffff
label-urgent-padding = 1

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = "CPU "
format-prefix-foreground = ${colors.foreground-alt}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 5
format-prefix = "RAM "
format-prefix-foreground = ${colors.foreground-alt}
label = %percentage_used%%

[module/temperature]
type = internal/temperature
thermal-zone = 0
base-temperature = 30
warn-temperature = 75

format-prefix = "TEMP "
format-prefix-foreground = ${colors.foreground-alt}
label = %temperature-c%

format-warn-prefix = "TEMP "
format-warn-prefix-foreground = ${colors.yellow}
label-warn = %temperature-c%
label-warn-foreground = ${colors.yellow}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M:%S
label = "%{F#ff6159}%date%%{F-}  %time%"
label-foreground = ${colors.foreground}

[module/volume]
type = internal/pulseaudio
use-ui-max = false

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.foreground-alt}
label-volume = %percentage%%

format-muted-prefix = "VOL "
format-muted-prefix-foreground = ${colors.alert}
label-muted = MUTED
label-muted-foreground = ${colors.foreground-alt}

click-right = pavucontrol

[module/battery]
type = custom/script
exec = cat /tmp/bat_status 2>/dev/null || echo ""
interval = 10
label = %output%
label-foreground = ${colors.foreground}

[module/fan]
type = custom/script
exec = cat /tmp/fan_speed 2>/dev/null || echo ""
interval = 10
format-prefix = "FAN "
format-prefix-foreground = ${colors.foreground-alt}
label = %output%

[module/bluetooth]
type = custom/script
exec = bluetoothctl show 2>/dev/null | grep -q "Powered: yes" && echo "󰂯" || echo "󰂲"
interval = 5
label = %output%
label-foreground = ${colors.cyan}
click-left = blueman-manager

[module/network]
type = custom/script
exec = ssid=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: '/^yes:/{print $2; exit}'); [ -n "$ssid" ] && echo "$ssid" || echo "off"
interval = 5
format-prefix = "NET "
format-prefix-foreground = ${colors.foreground-alt}
label = %output%
click-left = ~/.config/polybar/wifi-menu.sh
click-right = nm-connection-editor

[settings]
; A reload on every RandR change killed the bar for good: waking from the lock
; screen fires a DRM change while no output is enabled yet, and polybar exits
; with "Monitor HDMI-1 not found or disconnected". hdmi-output.sh relaunches the
; bar after it settles the outputs instead.
screenchange-reload = false
pseudo-transparency = false
