# === Shadows ===
shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@"
];

# === Fading ===
fading = false;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

# === Transparency ===
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Rofi'",
    "class_g = 'dmenu'"
];

# === Blur ===
# Nothing on the desktop is translucent any more, so there is nothing to blur.
blur-background = false;

# === Corners ===
# Square corners: the Arasaka look is hard edges, not rounded cards.
corner-radius = 0;
rounded-corners-exclude = [ ];

# === General ===
# glx puts compositing on the iGPU. Under xrender the shadows and rounded
# corners were convolved by the CPU inside the X server, and with vsync off
# picom repainted as fast as its clients produced frames — a SPICE virt-viewer
# window alone drove Xorg to ~50% of a core with the desktop otherwise idle.
backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
