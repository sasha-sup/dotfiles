# === Shadows ===
shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@"
];

# === Fading ===
fading = false;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

# === Transparency ===
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Rofi'",
    "class_g = 'dmenu'"
];

# === Blur ===
# Only translucent windows are blurred, and polybar is the only one, so this
# costs nothing on the rest of the desktop. Kernel blur is what the xrender
# backend supports; dual_kawase would need glx.
blur-background = true;
blur-method = "kernel";
blur-kern = "11x11gaussian";
# Whitelist, not blacklist: anything that is not the bar is excluded. Chrome and
# Electron apps use 32-bit ARGB visuals, so a blacklist lets picom blur their
# full window on every repaint, which stalls scrolling.
blur-background-exclude = [
    "class_g != 'Polybar'",
    "_GTK_FRAME_EXTENTS@"
];

# === Corners ===
corner-radius = 6;
rounded-corners-exclude = [ ];

# === General ===
backend = "xrender";
vsync = false;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
