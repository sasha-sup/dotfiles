# === Shadows ===
shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@"
];

# === Fading ===
fading = false;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

# === Transparency ===
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Rofi'",
    "class_g = 'dmenu'"
];

# === Blur ===
# Only translucent windows are blurred, and polybar is the only one, so this
# costs nothing on the rest of the desktop. dual_kawase is the glx-backend blur;
# it replaced the 11x11 kernel convolution the xrender backend needed.
#
# Strength 2, not the default 5: dual_kawase scales its radius with strength, and
# at 5 the wallpaper behind the bar smears into one flat tone, so the bar reads as
# opaque even though it is still 80% alpha. 2 keeps the radius near the 11x11
# gaussian this replaced, and the wallpaper pattern stays visible through the bar.
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 2;
# Whitelist, not blacklist: anything that is not the bar is excluded. Chrome and
# Electron apps use 32-bit ARGB visuals, so a blacklist lets picom blur their
# full window on every repaint, which stalls scrolling.
blur-background-exclude = [
    "class_g != 'Polybar'",
    "_GTK_FRAME_EXTENTS@"
];

# === Corners ===
corner-radius = 6;
rounded-corners-exclude = [ ];

# === General ===
# glx puts compositing on the iGPU. Under xrender the shadows and rounded
# corners were convolved by the CPU inside the X server, and with vsync off
# picom repainted as fast as its clients produced frames — a SPICE virt-viewer
# window alone drove Xorg to ~50% of a core with the desktop otherwise idle.
backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
