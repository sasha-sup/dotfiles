# Terminator-like kitty setup in the Cyberpunk 2077 HUD palette. Every value is
# a MainColors.* entry from the game's main_colors.inkstyle, clamped to sRGB.
font_family JetBrainsMono Nerd Font
font_size 14.0

# MainColors.Neutral: HUD red as body text made red output unreadable
foreground #c0c8cf
background #0e0e17

cursor #ff6159
cursor_text_color #0e0e17

selection_foreground #5ef6ff
selection_background #172c2e

# color0 sits above the background and color8 well above it: htop paints dim
# text and meter shading in bright black, which vanishes when color8 == background
color0  #161625
color1  #ff6159
color2  #1ded83
color3  #ffd741
color4  #4f88d5
color5  #c583ff
color6  #52dddf
color7  #c0c8cf
color8  #757575
color9  #ff7167
color10 #29ffb9
color11 #ffff4e
color12 #64a1ff
color13 #d2a0ff
color14 #5ef6ff
color15 #ffffff

background_image /home/sasha/Pictures/wallpapers/koi-lanterns.jpg
# cscaled keeps the logo's proportions; scaled stretched it in narrow windows
background_image_layout cscaled
background_tint 0.95

scrollback_lines -1
copy_on_select clipboard
mouse_map right press ungrabbed
mouse_map right release ungrabbed paste_from_selection
confirm_os_window_close 0
enable_audio_bell no

hide_window_decorations yes
window_padding_width 10
draw_minimal_borders yes

enabled_layouts splits,tall,stack
tab_bar_edge top

map ctrl+shift+o launch --location=hsplit --cwd=current --copy-env
map ctrl+shift+e launch --location=vsplit --cwd=current --copy-env

map ctrl+shift+z toggle_layout stack

map alt+up neighboring_window up
map alt+down neighboring_window down
map alt+left neighboring_window left
map alt+right neighboring_window right

map ctrl+page_down next_tab
map ctrl+page_up previous_tab
